services:
  alexey-sites-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alexey-sites-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
